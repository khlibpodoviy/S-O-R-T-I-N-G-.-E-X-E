<!DOCTYPE html>
<html lang="ru" data-type="hybrid">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORTING_SYSTEM.EXE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=PT+Serif:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Monochromatic by default */
            --bg-color: #080808;
            --fg-color: #d1cfc7;
            --glow-color: rgba(209, 207, 199, 0.15);
            --border-width: 4px;
        }

        /* House Themes (Dark Academia / Softer Palette) */
        body.theme-gryffindor {
            --bg-color: #1c0d0d;
            --fg-color: #b85151;
            --glow-color: rgba(184, 81, 81, 0.1);
        }
        body.theme-slytherin {
            --bg-color: #0e1711;
            --fg-color: #688f70;
            --glow-color: rgba(104, 143, 112, 0.1);
        }
        body.theme-ravenclaw {
            --bg-color: #0c121c;
            --fg-color: #6b8caf;
            --glow-color: rgba(107, 140, 175, 0.1);
        }
        body.theme-hufflepuff {
            --bg-color: #1a1710;
            --fg-color: #c7a456;
            --glow-color: rgba(199, 164, 86, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--fg-color);
            font-family: 'Press Start 2P', monospace;
            text-shadow: 0 0 2px var(--glow-color);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            transition: background-color 1s, color 1s, text-shadow 1s;
            line-height: 1.6;
        }

        /* CRT Scanlines and flicker */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            5% { opacity: 0.85; }
            10% { opacity: 0.95; }
            100% { opacity: 1; }
        }

        .crt-container {
            width: 100%;
            max-width: 960px;
            padding: 2rem;
            position: relative;
            z-index: 10;
            animation: none;
        }

        .retro-box {
            border: var(--border-width) solid var(--fg-color);
            background-color: var(--bg-color);
            padding: 2rem;
            position: relative;
            box-shadow: 0 0 4px var(--glow-color), inset 0 0 4px var(--glow-color);
        }

        /* Corner accents for the box */
        .retro-box::after, .retro-box::before {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            background: var(--fg-color);
        }
        .retro-box::before { top: -4px; left: -4px; box-shadow: calc(100% + 4px) 0 0 var(--fg-color); }
        .retro-box::after { bottom: -4px; right: -4px; }

        .btn-retro {
            background: var(--bg-color);
            color: var(--fg-color);
            border: 2px solid var(--fg-color);
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            text-transform: uppercase;
            transition: none; /* No smooth transitions in retro! */
            box-shadow: 0 0 2px var(--glow-color);
            font-size: 0.7rem;
            text-align: left;
        }

        .btn-retro:hover {
            background: var(--fg-color);
            color: var(--bg-color);
            text-shadow: none;
        }

        .btn-retro:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-retro:disabled:hover {
            background: var(--bg-color);
            color: var(--fg-color);
        }

        .health-bar-container {
            border: 2px solid var(--fg-color);
            height: 24px;
            width: 100%;
            padding: 2px;
            margin-bottom: 2rem;
        }

        .health-bar-fill {
            background-color: var(--fg-color);
            height: 100%;
            width: 0%;
            box-shadow: 0 0 3px var(--glow-color);
        }

        .cursor-blink {
            animation: blink 1s step-end infinite;
            display: inline-block;
            width: 10px;
            height: 1em;
            background-color: var(--fg-color);
            vertical-align: bottom;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .hidden { display: none !important; }
        
        /* Typography overrides for readability */
        h1 { font-size: 1.5rem; line-height: 1.5; }
        h2 { font-size: 1rem; line-height: 1.8; }
        p { font-size: 0.8rem; line-height: 1.8; }
        
        @media (min-width: 768px) {
            h1 { font-size: 2rem; }
            h2 { font-size: 1.2rem; }
            p { font-size: 1rem; }
            .btn-retro { font-size: 0.9rem; }
        }

        /* SVG Pixel Art Styling */
        .pixel-art {
            width: 128px;
            height: 128px;
            margin: 0 auto;
            display: block;
            filter: drop-shadow(0 0 2px var(--glow-color));
        }
        .pixel-art rect {
            fill: var(--fg-color);
        }
        .pixel-art .bg-rect {
            fill: var(--bg-color);
        }

        /* Hat Animation */
        .pixel-hat .mouth-open { opacity: 0; }
        .pixel-hat .mouth-closed { opacity: 1; }

        .pixel-hat.is-talking .mouth-open {
            animation: mouth-flap 0.2s steps(1) infinite;
        }
        .pixel-hat.is-talking .mouth-closed {
            animation: mouth-flap-alt 0.2s steps(1) infinite;
        }

        @keyframes mouth-flap {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        @keyframes mouth-flap-alt {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Анимация для маскотов факультета */
        .pixel-mascot {
            width: 80px;
            height: 80px;
            display: block;
            filter: drop-shadow(0 0 2px var(--glow-color));
            animation: mascot-hop 0.5s steps(2) infinite alternate;
        }

        @keyframes mascot-hop {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        /* Vertical Layout */
        .vertical-layout {
            min-height: 650px;
            display: flex;
            flex-direction: column;
        }

        /* Muted house colours; the text remains warm and legible. */
        :root { --bg-color:#111210; --panel:#181916; --fg-color:#e1dfd4; --accent:#aaa99d; --line:#55574f; --hover:#2a2b25; --glow-color:transparent; --border-width:2px; }
        body.theme-gryffindor { --bg-color:#1c1516; --panel:#241a1b; --fg-color:#eaded6; --accent:#d19487; --line:#795451; --hover:#38272a; --glow-color:transparent; }
        body.theme-slytherin { --bg-color:#131b18; --panel:#1b2520; --fg-color:#dce7df; --accent:#9ab8a4; --line:#526e60; --hover:#27372e; --glow-color:transparent; }
        body.theme-ravenclaw { --bg-color:#151b24; --panel:#1c2530; --fg-color:#dfe6ee; --accent:#9eb6d2; --line:#536a84; --hover:#293747; --glow-color:transparent; }
        body.theme-hufflepuff { --bg-color:#1e1b13; --panel:#282319; --fg-color:#eee5d1; --accent:#d3bb81; --line:#81704a; --hover:#3b3221; --glow-color:transparent; }
        body { text-shadow:none; }
        body::before { background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.045) 3px 4px); background-size:auto; }
        .crt-container { padding:1.25rem; }
        .toolbar { display:flex; gap:1rem; flex-wrap:wrap; justify-content:flex-end; align-items:center; margin:0 0 1rem; font-size:.65rem; }
        .toolbar button { background:transparent; color:var(--fg-color); border:0; cursor:pointer; font:inherit; }
        .toolbar .sound-toggle { border:1px solid var(--line); padding:.55rem .65rem; color:var(--accent); }
        .retro-box { border-color:var(--line); background:var(--panel); box-shadow:none; }
        .retro-box::before,.retro-box::after { width:7px;height:7px;background:var(--accent);box-shadow:none; }
        .retro-box::before { top:-2px;left:-2px; }.retro-box::after { bottom:-2px;right:-2px; }
        .btn-retro { background:transparent; color:var(--fg-color); border-color:var(--line); box-shadow:none; line-height:1.8; transition:background .12s,border-color .12s; }
        .btn-retro:hover,.btn-retro:focus-visible { background:var(--hover); color:var(--fg-color); border-color:var(--accent); }
        button:focus-visible { outline:2px solid var(--accent);outline-offset:4px; }
        .health-bar-container { border-color:var(--line);height:15px; }
        .health-bar-fill,.cursor-blink { background:var(--accent);box-shadow:none; }
        .pixel-art,.pixel-mascot { filter:none; }
        .pixel-art rect { fill:var(--accent); }
        .pixel-art .bg-rect { fill:var(--panel); }
        #mascot-container svg rect[fill="var(--fg-color)"] { fill:var(--accent); }
        #mascot-container svg rect[fill="var(--bg-color)"] { fill:var(--panel); }
        #result-house { color:var(--accent); overflow-wrap:anywhere; }
        #start-desc,#question-text,#tie-breaker-text,#result-desc { white-space:pre-wrap; overflow-wrap:break-word; }
        .border-dashed { border-color:var(--line) !important; }
        @media(max-width:767px) { .retro-box { padding:1.1rem; } .crt-container { padding:.8rem; } .toolbar { gap:.6rem; } }
        @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important;transition:none !important; } }

        .mb-8{margin-bottom:2rem}.mb-6{margin-bottom:1.5rem}.mb-4{margin-bottom:1rem}.mb-2{margin-bottom:.5rem}.mt-2{margin-top:.5rem}.mt-4{margin-top:1rem}.space-y-3>*+*{margin-top:.75rem}

        /* Typography presets: independent of house palette and game state. */
        :root {
            --pixel: 'Press Start 2P', 'Courier New', monospace;
            --mono: 'IBM Plex Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace;
            --book: 'PT Serif', Georgia, 'Liberation Serif', serif;
            --dialogue: var(--mono); --display: var(--pixel); --interface: var(--mono);
            --dialogue-size: 1rem; --question-size: 1.06rem; --display-size: .91rem;
            --answer-size: .88rem; --display-leading: 1.75; --dialogue-leading: 1.72;
            --display-weight: 400; --dialogue-weight: 400; --interface-weight: 500;
        }
        html[data-type="pixel"] {
            --dialogue:var(--pixel); --display:var(--pixel); --interface:var(--pixel);
            --dialogue-size:.68rem; --question-size:.75rem; --display-size:.91rem;
            --answer-size:.67rem; --dialogue-leading:2; --interface-weight:400;
        }
        html[data-type="terminal"] {
            --dialogue:var(--mono); --display:var(--mono); --interface:var(--mono);
            --dialogue-size:1rem; --question-size:1.08rem; --display-size:1.4rem;
            --answer-size:.9rem; --display-weight:600; --dialogue-leading:1.65;
        }
        html[data-type="book"] {
            --dialogue:var(--book); --display:var(--book); --interface:var(--mono);
            --dialogue-size:1.14rem; --question-size:1.23rem; --display-size:1.65rem;
            --answer-size:.9rem; --display-weight:700; --dialogue-leading:1.55;
        }
        body { font-family:var(--dialogue); }
        #title-text,#result-house,#tie-title {
            font-family:var(--display);font-size:var(--display-size);font-weight:var(--display-weight);
            line-height:var(--display-leading);letter-spacing:0;overflow-wrap:anywhere;
        }
        #start-desc,#result-desc,#tie-breaker-text,#question-text {
            font-family:var(--dialogue);font-size:var(--dialogue-size);
            line-height:var(--dialogue-leading);font-weight:var(--dialogue-weight);
        }
        #question-text { font-size:var(--question-size); }
        .btn-retro { font-family:var(--interface);font-size:var(--answer-size);font-weight:var(--interface-weight);line-height:1.55;overflow-wrap:anywhere; }
        #question-counter,#verdict-prefix,.toolbar { font-family:var(--mono);font-size:.76rem;line-height:1.5; }
        #btn-back {font-size:.73rem;}
        #start-options {gap:.75rem;}
        .font-control { display:flex;align-items:center;gap:.45rem;color:var(--accent); }
        #font-select { font:inherit;color:var(--fg-color);background:var(--panel);border:1px solid var(--line);border-radius:0;padding:.43rem .4rem;max-width:100%; }
        #font-select:focus-visible {outline:2px solid var(--accent);outline-offset:3px;}
        html[data-type="book"] #title-text,html[data-type="book"] #result-house {letter-spacing:.025em;}
        @media (max-width:767px) {
            :root {--display-size:.85rem;--question-size:1rem;--dialogue-size:.96rem;--answer-size:.84rem;}
            html[data-type="pixel"] {--display-size:.85rem;--question-size:.72rem;--dialogue-size:.66rem;--answer-size:.64rem;}
            html[data-type="terminal"] {--display-size:1.24rem;--question-size:1rem;--dialogue-size:.96rem;--answer-size:.84rem;}
            html[data-type="book"] {--display-size:1.45rem;--question-size:1.15rem;--dialogue-size:1.06rem;--answer-size:.84rem;}
            .toolbar {justify-content:flex-end;}
        }
    </style>
</head>
<body>
    <div class="crt-container w-full max-w-4xl mx-auto" id="main-container">
        
        <!-- Language Switcher -->
        <div class="toolbar">
            <label class="font-control" for="font-select"><span id="font-label">ШРИФТ</span>
                <select id="font-select" onchange="setTypography(this.value)">
                    <option value="hybrid">Гибрид</option>
                    <option value="pixel">Пиксели</option>
                    <option value="terminal">Терминал</option>
                    <option value="book">Книжный</option>
                </select>
            </label>
            <button onclick="changeLang('en')" class="lang-btn opacity-50 hover:opacity-100 transition-opacity text-[var(--fg-color)]" lang="en" data-lang="en">EN</button>
            <button onclick="changeLang('uk')" class="lang-btn opacity-50 hover:opacity-100 transition-opacity text-[var(--fg-color)]" lang="uk" data-lang="uk">UA</button>
            <button onclick="changeLang('ru')" class="lang-btn opacity-100 hover:opacity-100 transition-opacity text-[var(--fg-color)]" lang="ru" data-lang="ru">RU</button>
            <button id="sound-toggle" class="sound-toggle" type="button" onclick="toggleSound()" aria-pressed="false">ЗВУК: ВЫКЛ</button>
        </div>

        <!-- НОВАЯ СТРУКТУРА: Две колонки (Слева - Шляпа и диалоги, Справа - Действия) -->
        <div class="retro-box w-full mx-auto relative grid grid-cols-1 md:grid-cols-2 gap-8 min-h-[500px]">
            
            <!-- ЛЕВАЯ КОЛОНКА: Шляпа и Текст -->
            <div class="flex flex-col items-center md:items-start border-b md:border-b-0 md:border-r border-dashed border-[var(--fg-color)] pb-8 md:pb-0 md:pr-8">
                
                <!-- Анимированная Шляпа -->
                <div class="flex-shrink-0 flex justify-center w-full mb-8 mt-2">
                    <svg id="sorting-hat-anim" class="pixel-art pixel-hat" viewBox="0 0 16 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
                        <!-- Hat tip -->
                        <rect x="7" y="2" width="2" height="1"/>
                        <rect x="6" y="3" width="4" height="1"/>
                        <rect x="5" y="4" width="4" height="2"/>
                        <rect x="4" y="6" width="6" height="2"/>
                        <!-- Hat face area -->
                        <rect x="3" y="8" width="8" height="2"/>
                        <rect x="2" y="10" width="10" height="2"/>
                        <!-- Hat brim -->
                        <rect x="1" y="12" width="14" height="2"/>
                        
                        <!-- Eyes -->
                        <rect class="bg-rect" x="5" y="9" width="2" height="1"/>
                        <rect class="bg-rect" x="9" y="9" width="2" height="1"/>
                        
                        <!-- Mouth Closed -->
                        <rect class="bg-rect mouth-closed" x="5" y="11" width="6" height="1"/>
                        
                        <!-- Mouth Open -->
                        <rect class="bg-rect mouth-open" x="4" y="10" width="8" height="2"/>
                    </svg>
                </div>

                <!-- Контейнеры для диалогов Шляпы -->
                <div class="w-full flex-grow flex flex-col">
                    
                    <!-- Экран Приветствия -->
                    <div id="text-start" class="w-full flex flex-col">
                        <h1 id="title-text" class="mb-4 uppercase text-center md:text-left">Распределение.exe</h1>
                        <p id="start-desc" class="text-left leading-relaxed min-h-[120px]"></p>
                    </div>

                    <!-- Экран Вопросов -->
                    <div id="text-quiz" class="w-full hidden flex-col">
                        <div class="flex justify-between items-center mb-2 text-xs">
                            <span id="question-counter">ВОПРОС: 01/XX</span>
                        </div>
                        <div class="health-bar-container mb-6">
                            <div id="progress-bar" class="health-bar-fill transition-all duration-300 w-0"></div>
                        </div>
                        <h2 id="question-text" class="text-left leading-relaxed min-h-[150px]"></h2>
                    </div>

                    <!-- Экран Спорного Выбора -->
                    <div id="text-tie" class="w-full hidden flex-col">
                        <h2 id="tie-title" class="text-xl mb-4 uppercase text-left">! СИСТЕМНЫЙ СБОЙ !</h2>
                        <p id="tie-breaker-text" class="text-sm leading-loose text-left min-h-[150px]"></p>
                    </div>

                    <!-- Экран Результата -->
                    <div id="text-result" class="w-full hidden flex-col text-left">
                        <p id="verdict-prefix" class="text-sm mb-2">> ВЕРДИКТ ВЫНЕСЕН...</p>
                        <h1 id="result-house" class="mb-4 uppercase text-2xl">FAKULTET</h1>
                        <div class="w-full h-1 border-t-2 border-dashed mb-4 border-[var(--fg-color)]"></div>
                        <p id="result-desc" class="text-sm leading-loose min-h-[150px]"></p>
                    </div>

                </div>
            </div>

            <!-- ПРАВАЯ КОЛОНКА: Кнопки и Ответы -->
            <div class="flex flex-col justify-center items-center w-full min-h-[350px]">
                
                <!-- Кнопка Старта -->
                <div id="start-options" class="w-full hidden flex-col gap-3 transition-opacity duration-300" inert>
                    <button id="btn-start" onclick="startTest('short')" class="btn-retro py-4 px-6 w-full" disabled></button>
                    <button id="btn-start-long" onclick="startTest('long')" class="btn-retro py-4 px-6 w-full" disabled></button>
                </div>

                <!-- Контейнер Ответов (Opacity используется чтобы не сдвигать макет) -->
                <div id="answers-container" class="flex-col space-y-3 w-full hidden transition-opacity duration-300">
                    <button id="ans-btn-0" onclick="handleAnswer(0)" class="btn-retro py-3 px-4">[ 1 ] Ни в коем разе</button>
                    <button id="ans-btn-1" onclick="handleAnswer(1)" class="btn-retro py-3 px-4">[ 2 ] Скорее нет, чем да</button>
                    <button id="ans-btn-2" onclick="handleAnswer(2)" class="btn-retro py-3 px-4">[ 3 ] Трудно судить</button>
                    <button id="ans-btn-3" onclick="handleAnswer(3)" class="btn-retro py-3 px-4">[ 4 ] Скорее да, чем нет</button>
                    <button id="ans-btn-4" onclick="handleAnswer(4)" class="btn-retro py-3 px-4">[ 5 ] Бесспорно так</button>
                    
                    <div class="flex justify-start mt-4 border-t border-dashed pt-4 border-[var(--fg-color)]">
                        <button id="btn-back" onclick="goBack()" class="btn-retro py-2 px-4 text-xs opacity-0 pointer-events-none transition-opacity duration-300">
                            < НАЗАД

            try { localStorage.setItem('sorting-hat-typography', preset); } catch (_) {}

        let audioContext = null;

        function updateSoundButton() {
            const button = document.getElementById('sound-toggle');
            button.textContent = i18n[soundEnabled ? 'soundOn' : 'soundOff'][currentLang];
            button.title = i18n.soundHint[currentLang];

        async function toggleSound() {
            if (soundEnabled) {
                soundEnabled = false; stopVoice(); updateSoundButton(); return;
            }
            try {
                const Audio = window.AudioContext || window.webkitAudioContext;
                if (!Audio) return;
                if (!audioContext) {
                    audioContext = new Audio();
                    voiceBus = audioContext.createGain();
                    voiceBus.gain.value = 0.24;
                    voiceBus.connect(audioContext.destination);
                }
                await audioContext.resume();
                soundEnabled = audioContext.state === 'running';
                updateSoundButton();
                if (soundEnabled) voiceSyllable(5, true);
            } catch (err) { soundEnabled = false; updateSoundButton(); }
        }
        function stopVoice() {
            for (const node of voiceNodes) { try { node.stop(); } catch {} }
            voiceNodes.clear();
            lastVoiceTime = 0;
        }
        function voiceSyllable(seed, soft = false) {
            if (!soundEnabled || !audioContext || audioContext.state !== 'running') return;
            const t = audioContext.currentTime;
            const length = 0.070 + (seed % 4) * 0.008;
            const pitch = [132,147,156,165,175,139,151][seed % 7];
            const envelope = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.value = 680 + (seed % 5) * 110; filter.Q.value = 0.9;
            const osc = audioContext.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(pitch * 1.08, t);
            osc.frequency.exponentialRampToValueAtTime(pitch * 0.86, t + length);
            const overtone = audioContext.createOscillator();
            overtone.type = 'square'; overtone.frequency.value = pitch * 2;
            const harmonicGain = audioContext.createGain(); harmonicGain.gain.value = 0.075;
            osc.connect(filter); overtone.connect(harmonicGain); harmonicGain.connect(filter);
            filter.connect(envelope); envelope.connect(voiceBus);
            envelope.gain.setValueAtTime(0.0001,t);
            envelope.gain.exponentialRampToValueAtTime(soft ? 0.075 : 0.115,t + 0.012);
            envelope.gain.exponentialRampToValueAtTime(0.0001,t + length);
            for (const node of [osc,overtone]) { voiceNodes.add(node); node.start(t); node.stop(t + length + .008); }
            osc.onended = () => { voiceNodes.delete(osc); voiceNodes.delete(overtone); envelope.disconnect(); };
        }
        function speakGlyph(text, i) {

            const t = audioContext.currentTime;
            if (t - lastVoiceTime < .085 && lastVoiceTime !== 0) return;
            const vowel = /[aeiouyаеёиоуыэюяєії]/i.test(ch);
            if (!vowel && i % 3 !== 0 && !/\s/.test(text[i-2] || ' ')) return;
            lastVoiceTime = t;
            voiceSyllable(ch.toLowerCase().codePointAt(0) + i % 5);
        }

            if (isTyping || currentScreen !== 'quiz' || !questions[currentQuestionIndex]) return;

            const currentQ = questions[currentQuestionIndex];
            history.push([...answers]);
            answers.push({ house: currentQ.house, value: (currentQ.reverse ? 4 - value : value) * questionWeight(currentQ) });

        // 8 value items × 3 and 12 behaviour items × 2: equal total weight.
        function questionWeight(q) { return testMode === 'short' ? 1 : (q.kind === 'value' ? 3 : 2); }

        function calculateWinner() {
            const scores = { G: 0, S: 0, R: 0, H: 0 };
            const maxScores = { G: 0, S: 0, R: 0, H: 0 };

            questions.forEach(q => maxScores[q.house] += 4 * questionWeight(q));
            answers.forEach(ans => scores[ans.house] += ans.value);

            const percentages = {
                G: (maxScores.G > 0) ? (scores.G / maxScores.G) * 100 : 0,
                S: (maxScores.S > 0) ? (scores.S / maxScores.S) * 100 : 0,
                R: (maxScores.R > 0) ? (scores.R / maxScores.R) * 100 : 0,
                H: (maxScores.H > 0) ? (scores.H / maxScores.H) * 100 : 0
            };

            // Compare exact score ratios using integer cross-multiplication.
            // A choice is offered only to houses tied for first place.
            const houses = Object.keys(scores).filter(h => maxScores[h] > 0);
            const leader = houses.reduce((best, h) =>
                scores[h] * maxScores[best] > scores[best] * maxScores[h] ? h : best
            );
            const tiedHouses = houses.filter(h =>
                scores[h] * maxScores[leader] === scores[leader] * maxScores[h]
            );

            // Прячем экран викторины полностью
            document.getElementById('text-quiz').classList.add('hidden');
            document.getElementById('answers-container').classList.add('hidden');

            if (tiedHouses.length > 1) {
                showTieBreaker(tiedHouses);
            } else {
                showResultScreen(tiedHouses[0]);
            }
        }

        function showTieBreaker(houses) {
            currentScreen = 'tie';
            tiedHousesState = houses;
            document.getElementById('text-tie').classList.remove('hidden');
            document.getElementById('text-tie').classList.add('flex');

            const optionsContainer = document.getElementById('tie-breaker-options');
            optionsContainer.classList.remove('hidden');
            optionsContainer.classList.add('flex', 'opacity-0', 'pointer-events-none');
            optionsContainer.inert = true;
            
            renderTieOptions(houses);

            typeWriter('tie-breaker-text', i18n.tieDesc[currentLang], 30, () => {
                optionsContainer.classList.remove('opacity-0', 'pointer-events-none');
                optionsContainer.classList.add('opacity-100');
                optionsContainer.inert = false;
            });
        }

        function renderTieOptions(houses) {
            const optionsContainer = document.getElementById('tie-breaker-options');
            optionsContainer.innerHTML = '';
            houses.forEach(house => {
                const btn = document.createElement('button');
                btn.className = 'btn-retro py-3 px-4 text-center';
                btn.textContent = i18n.tieBtnPrefix[currentLang] + i18n.houses[house][currentLang];
                btn.onclick = () => {
                    document.getElementById('text-tie').classList.add('hidden');
                    optionsContainer.classList.add('hidden');
                    showResultScreen(house);
                };
                optionsContainer.appendChild(btn);
            });
        }

        function showResultScreen(winnerHouse) {
            currentScreen = 'result';
            finalHouse = winnerHouse;
            const resultScreen = document.getElementById('text-result');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');

            const btnRestart = document.getElementById('btn-restart');
            btnRestart.classList.remove('hidden');
            btnRestart.classList.add('opacity-0', 'pointer-events-none');
            btnRestart.disabled = true;


            const houseClasses = {
                'G': 'theme-gryffindor',
                'S': 'theme-slytherin',
                'R': 'theme-ravenclaw',
                'H': 'theme-hufflepuff'
            };


            const mascotContainer = document.getElementById('mascot-container');
            mascotContainer.innerHTML = mascots[winnerHouse];
            mascotContainer.classList.remove('hidden');
            mascotContainer.classList.add('flex');

            document.body.classList.add(houseClasses[winnerHouse]);
            document.getElementById('result-house').textContent = i18n.houses[winnerHouse][currentLang];
            
            typeWriter('result-desc', i18n.descriptions[winnerHouse][currentLang], 40, () => {
                btnRestart.classList.remove('opacity-0', 'pointer-events-none');
                btnRestart.classList.add('opacity-100');
                btnRestart.disabled = false;
                
                // Проявляем пиксельного маскота вместе с кнопкой
                mascotContainer.classList.remove('opacity-0');
                mascotContainer.classList.add('opacity-100');
            });
        }
    </script>
</body>
</html>
